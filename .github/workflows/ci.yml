name: CI

on:
  push:
    branches: [main, 'feat/**', 'test/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test tools
        run: pip install pytest-cov ruff

      - name: Create config from examples
        run: |
          mkdir -p config
          cp config/config.example.yaml config/config.yaml
          cp config/strategy_params.example.yaml config/strategy_params.yaml

      - name: Lint
        run: ruff check src/ tests/ --select E,F,W --ignore E501

      - name: Unit Tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=80 --ignore=tests/integration

      - name: Integration Tests
        run: pytest tests/integration/ -v
