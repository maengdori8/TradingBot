name: CI

on:
  push:
    branches: [main, 'feat/**', 'test/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test tools
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src/ tests/ --select E,F,W --ignore E501,E402

      - name: Unit Tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=80 --ignore=tests/integration

      - name: Integration Tests
        run: pytest tests/integration/ -v

      - name: Evidence Fault Injection Tests
        run: >-
          pytest tests/test_promotion_evidence.py tests/test_evidence_data.py -v
          -k 'tamper or symlink or corrupt or invalid_batch or gap or future'
