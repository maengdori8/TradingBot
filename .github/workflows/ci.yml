name: CI

on:
  push:
    branches: [main, 'feat/**', 'test/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test tools
        # ruff 버전 고정 — 미고정 시 새 규칙이 추가될 때마다 CI 가 조용히 깨진다
        # (2026-09-01 ~ 09-04 main 15회 연속 실패의 원인).
        run: pip install pytest-cov 'ruff==0.15.8'

      - name: Create config from examples
        run: |
          mkdir -p config
          cp config/config.example.yaml config/config.yaml
          cp config/strategy_params.example.yaml config/strategy_params.yaml

      - name: Lint
        run: ruff check src/ tests/ --select E,F,W --ignore E501

      - name: Unit Tests
        run: pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=80 --ignore=tests/integration

      - name: Integration Tests
        run: pytest tests/integration/ -v
