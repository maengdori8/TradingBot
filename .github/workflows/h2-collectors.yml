name: h2-collectors

# H2 본검정(트랙 B) 전향 수집 — 일별 perpAllTime 스냅샷 + fills 프로토콜.
# 사전등록: docs/PREREGISTRATION_H2_2026-08-27.md.
# 기존 trader-recorder(UTC 00:40)와 분리된 워크플로 — 기존 수집을 건드리지 않는다.
# - UTC 00:50 일별: 전 코호트 portfolio 스냅샷(daily) + fills 폴링
# - UTC 06/12/18:50 intraday: 고회전율 상위 3분위 fills만 (6시간 간격)
# - fills 크론 게이트: mode=t0 (--t0-init) 완주가 t0_initialized_at 를 기록하기
#   전에는 일별/intraday fills 폴링이 자동 대기한다 (§2.3 순서 강제)
# - workflow_dispatch mode=t0|verdict|positions: 오케스트레이터 수동 트리거용
#   (t0 = 단일 초기화 원샷 §2.3: portfolio t0 → 포지션 기준선 → fills 첫 폴링.
#    positions 는 포지션 스냅만 따로 재시도할 때의 보조 모드.)
on:
  schedule:
    - cron: "50 0 * * *"
    - cron: "50 6,12,18 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | intraday | t0 | verdict | positions"
        required: false
        default: "daily"

permissions:
  contents: write

concurrency:
  group: h2-collectors
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'daily' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "50 0 * * *" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=intraday" >> "$GITHUB_OUTPUT"
          fi
      - name: H2 수집
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          echo "MODE=$MODE"
          case "$MODE" in
            daily)
              PYTHONPATH=. python -m carrybot.live.portfolio_snapshot --label daily
              PYTHONPATH=. python -m carrybot.live.fills_recorder
              ;;
            intraday)
              PYTHONPATH=. python -m carrybot.live.fills_recorder --intraday
              ;;
            t0)
              # T0 단일 초기화 (명세 §2.3) — 로컬 수동 실행과 동일 절차(--t0-init):
              # ① portfolio t0 → ② clearinghouseState 포지션 → ③ fills 첫 폴링
              PYTHONPATH=. python -m carrybot.live.fills_recorder --t0-init
              ;;
            verdict)
              PYTHONPATH=. python -m carrybot.live.portfolio_snapshot --label verdict
              ;;
            positions)
              PYTHONPATH=. python -m carrybot.live.fills_recorder --positions-snapshot
              ;;
            *)
              echo "알 수 없는 모드: $MODE" && exit 1
              ;;
          esac
      - name: 관측 커밋
        # 수집 스텝 실패·타임아웃(취소)에도 부분 산출물·상태를 커밋해
        # 재디스패치 이어받기가 동작하게 한다 (잘린 gzip 은 로더가 복구).
        if: always()
        run: |
          git config user.name  "h2-collectors"
          git config user.email "noreply@github.com"
          for p in logs/h2_snapshots logs/h2_fills logs/h2_fills_state.json logs/h2_positions_t0.jsonl.gz; do
            if [ -e "$p" ]; then git add -f "$p"; fi
          done
          git diff --staged --quiet || git commit -m "[trader] $(date -u +%Y-%m-%d) H2 수집 (${{ steps.mode.outputs.mode }})"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
