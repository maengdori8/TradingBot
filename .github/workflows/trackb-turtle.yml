name: trackb-turtle

# Track B (터틀 추세추종, 페이퍼 전용) — 매일 UTC 00:15에 직전 닫힌 일봉 1개 처리.
# 경고: 이 트랙에는 검증된 엣지가 없다. 실거래 승급 게이트와 완전 분리되어 있다.
on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trackb-turtle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install -q ccxt pandas numpy
      - name: 일봉 처리
        run: PYTHONPATH=. python -m carrybot.aggressive.runner
      - name: 상태 커밋
        run: |
          git config user.name  "trackb-turtle"
          git config user.email "noreply@github.com"
          git add -f logs/trackb_state.json logs/trackb_history.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "[trackb] $(date -u +%Y-%m-%d) 일봉 처리"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
