name: ICT Paper Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # logs/ 에는 페이퍼 거래 DB + 자동학습 상태(learned_params.yaml, tuning_history.jsonl)가
      # 함께 저장된다. GitHub Actions 캐시는 best-effort(7일 미사용 시 축출 가능)이며,
      # 축출되면 학습 오버레이가 사라져 config.yaml 기본값으로 복귀한다(코드가 안전 처리).
      # 장기 영속이 중요하면 로컬 runner 또는 외부 스토리지 사용 권장(deploy/ 가이드 참조).
      - name: 페이퍼 트레이딩 + 학습 상태 복원
        uses: actions/cache@v4
        with:
          path: logs/
          key: paper-trading-state
          restore-keys: paper-trading-state

      - name: logs 디렉토리 생성
        run: mkdir -p logs

      - name: 봇 실행
        run: python -m src.bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 페이퍼 트레이딩 상태 저장
        uses: actions/cache/save@v4
        if: always()
        with:
          path: logs/
          key: paper-trading-state-${{ github.run_id }}

      - name: 실패 시 Discord 알림
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"content": "⚠️ **봇 실행 실패** — Actions 로그 확인 필요"}'
