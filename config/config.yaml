testnet: true

exchange:
  name: bybit
  symbols:                      # scan.mode=static 일 때만 사용하는 고정 목록
    - "BTC/USDT:USDT"
    - "ETH/USDT:USDT"
    - "SOL/USDT:USDT"
    - "XRP/USDT:USDT"
    - "DOGE/USDT:USDT"
    - "AVAX/USDT:USDT"
  leverage: 5                   # auto_leverage=false 일 때 사용하는 고정 레버리지
  auto_leverage: true           # 포지션별 손절 거리 기반 레버리지 자동 설정
  max_leverage: 10              # 자동 레버리지 상한
  min_leverage: 1               # 자동 레버리지 하한
  liq_buffer: 2.0               # 청산거리 / 손절거리 배수 (클수록 보수적, 청산 여유↑)
  timeframes:
    - "15m"
    - "1h"
    - "4h"

runner:
  interval_sec: 300             # 로컬 주기 실행 간격(초). 5분마다 전체 스캔

scan:
  mode: dynamic                 # dynamic=거래량 상위 자동 스캔 / static=위 symbols 목록
  top_n: 40                     # 스캔할 거래량 상위 코인 수
  min_volume_usdt: 5000000      # 24h 거래대금 최소 필터 (저유동성 배제)
  min_score: 70                 # 진입 확정 최소 컨플루언스 점수 (70+ 진입, 차등 리스크)
  watchlist_min_score: 40       # 관심종목 표시 최소 점수
  watchlist_size: 12            # 대시보드 관심종목 최대 표시 수
  require_volume: true          # 거래량 확인 게이트

capital:
  total_capital: 5000        # 전체 자산 USDT
  trading_allocation: 0.25   # 트레이딩 투입 비율 (25% = 1250 USDT)
  risk_per_trade: 0.005      # 기본 리스크 (risk_tiers 미적용 시 fallback)

risk:
  min_rr_ratio: 2.0          # 최소 R:R = 1:2 (40개 스캔으로 빈도 확보, 승률 부담↓)
  max_positions: 4           # 동시 최대 포지션 수
  max_per_symbol: 1          # 심볼당 최대 1포지션 (분산 강제)
  max_same_direction: 3      # 같은 방향 최대 3포지션 (한쪽 쏠림 방지)
  max_exposure_pct: 0.80     # 총 담보금 < 트레이딩 자본 80%
  daily_loss_limit: 0.05     # 트레이딩 자본 5% 손실 시 당일 중단
  weekly_loss_limit: 0.12    # 트레이딩 자본 12% 손실 시 주간 중단
  max_consecutive_losses: 5  # 5연패 시 1일 강제 휴식
  # 컨플루언스 점수별 차등 리스크 (강한 셋업 크게, 약한 셋업 작게)
  risk_tiers:
    - {min_score: 85, risk_pct: 0.007}   # A급: 풀 컨플루언스
    - {min_score: 75, risk_pct: 0.005}   # B급: 표준
    - {min_score: 70, risk_pct: 0.003}   # C급: 가볍게

promote:
  min_trades: 20
  min_win_rate: 0.55
  min_profit_factor: 1.5
  max_mdd: 0.05
  min_sharpe: 1.0
  min_return_pct: 0.0
