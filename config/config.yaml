testnet: true

exchange:
  name: bybit
  symbols:
    - "BTC/USDT:USDT"
    - "ETH/USDT:USDT"
  leverage: 5
  timeframes:
    - "15m"
    - "1h"
    - "4h"

capital:
  total_capital: 5000        # 전체 자산 USDT
  trading_allocation: 0.25   # 트레이딩 투입 비율 (25% = 1250 USDT)
  risk_per_trade: 0.01       # 트레이딩 자본의 1% 리스크

risk:
  min_rr_ratio: 2.0          # 최소 R:R = 1:2
  max_positions: 2           # 동시 최대 포지션 수
  daily_loss_limit: 0.03     # 트레이딩 자본 3% 손실 시 당일 중단
  weekly_loss_limit: 0.08    # 트레이딩 자본 8% 손실 시 주간 중단
  max_consecutive_losses: 3  # 3연패 시 1일 강제 휴식

promote:
  min_trades: 20
  min_win_rate: 0.55
  min_profit_factor: 1.5
  max_mdd: 0.05
  min_sharpe: 1.0
  min_return_pct: 0.0
