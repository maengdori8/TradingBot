fvg:
  min_gap_pct: 0.001          # FVG 최소 크기 (0.1%)
  max_age_candles: 50         # FVG 유효 기간 (캔들 수)

order_block:
  threshold: 0.003            # OB 탐지 임계값 (0.3%)
  lookback: 20                # 탐지 탐색 범위

market_structure:
  swing_lookback: 5           # 스윙 포인트 탐지 범위

# 킬존: 더 이상 진입 게이트가 아님(24h 진입) — 점수 가점/태깅/학습 세그먼트용.
# 종전 값(02-05/07-10)은 ICT 원전의 ET 시각을 UTC에 오기입한 것이라 정정 (겨울 기준).
kill_zone:
  london_start_utc: "07:00"
  london_end_utc: "10:00"
  newyork_start_utc: "12:00"
  newyork_end_utc: "15:00"

ote:
  fib_low: 0.618              # OTE 피보나치 하단
  fib_high: 0.786             # OTE 피보나치 상단

# ICT 벤치마크의 기존 손절 설정. 양(+) 연구 결과는 HTF 룩어헤드로 오염되었으므로
# 실전 근거로 사용하거나 1.5ATR/RR2.0으로 자동 롤백하지 않는다.
atr:
  period: 14
  multiplier: 2.0

# ICT 벤치마크 출구 정책. 이전 양(+) 수치는 룩어헤드 오염으로 폐기되었으며,
# 새 후보와 비교하기 위한 고정 기준으로만 유지한다.
exits:
  mode: fixed_rr

# BTC 상위TF 추세 레짐 판정 (역추세 신호 사이징 강등용) — 연구 사용값 명시
btc_trend:
  ema_period: 50          # BTC 4h EMA 기간
  slope_lookback: 10      # 기울기 판정 봉 수
  counter_risk_pct: 0.003 # 역추세(counter) 신호의 risk_pct 강등값 (하드 차단 아님)
