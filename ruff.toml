# CLAUDE.md 규약 "from __future__ import annotations 모든 파일 첫줄" 과 ruff E402 의 충돌 해소.
# __future__ import 를 첫 줄에 두면 그 뒤의 모듈 docstring 이 docstring 이 아니라 일반
# 문자열 문장으로 파싱되고, 그 결과 이후 import 가 전부 "top of file 이 아님"(E402)으로
# 잡힌다. 규약을 바꾸는 대신 tests/ 에서만 E402 를 면제한다 (src/ 에는 위반이 없다).
[lint.per-file-ignores]
"tests/*" = ["E402"]
